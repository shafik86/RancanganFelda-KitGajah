<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peta Kit Gajah FELDA 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<body>

<!-- Icons (Lucide-style, stroke) — use with <svg class="ico"><use href="#i-name"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-map"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15"/><path d="M15 6v15"/></g>

    <g id="i-clock"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
    <g id="i-shield"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></g>
    <g id="i-radio"><rect x="7" y="7" width="10" height="15" rx="2"/><path d="M10 7V2"/><path d="M10 12h4"/><path d="M10 16h4"/></g>
    <g id="i-megaphone"><path d="M3 11l18-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></g>
    <g id="i-siren"><path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21h14v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M12 2v1"/><path d="M21 12h1"/><path d="M2 12h1"/><path d="M4.9 4.9l.7.7"/><path d="M19.1 4.9l-.7.7"/></g>
    <g id="i-x"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></g>
    <g id="i-list"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></g>
    <g id="i-globe"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></g>

    <g id="i-waves"><path d="M2 6c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></g>

    <g id="i-search"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></g>
    <g id="i-panel"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></g>

</svg>

<aside id="sidebar">
  <header>
    <div class="eyebrow">FarmGuard · Pembekalan Kit Gajah 2026</div>
    <h1>Tracking Rancangan FELDA</h1>
    <button id="closeSidebar" class="icon-btn" type="button" title="Tutup sidebar" aria-label="Tutup sidebar">
      <svg class="ico"><use href="#i-x"/></svg>
    </button>
    <div class="stats overview">
      <div class="stat g-sky"><span><svg class="ico"><use href="#i-map"/></svg>Wilayah</span><b id="tWilayah">0</b></div>
      <div class="stat g-mint"><span><svg class="ico"><use href="#i-pin"/></svg>Rancangan</span><b id="tRancangan">0</b></div>
      <div class="stat g-peach"><span><svg class="ico"><use href="#i-clock"/></svg>Pending</span><b id="tPending">0</b><small id="tPendingSub"></small></div>
    </div>
    <div class="stats kitstats">
      <div class="stat g-lime"><span><svg class="ico"><use href="#i-shield"/></svg>SM Mammoth</span><b id="tMammoth">0</b></div>
      <div class="stat g-lilac"><span><svg class="ico"><use href="#i-radio"/></svg>Walkie</span><b id="tWalkie">0</b></div>
      <div class="stat g-rose"><span><svg class="ico"><use href="#i-megaphone"/></svg>Hailer</span><b id="tHailer">0</b></div>
      <div class="stat g-sand"><span><svg class="ico"><use href="#i-siren"/></svg>Blinker</span><b id="tBlinker">0</b></div>
    </div>
    <div class="sub-stats" id="subStats"></div>
  </header>

  <div class="controls">
    <label class="search">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Cari rancangan, daerah, contact…" autocomplete="off">
    </label>
    <div class="row2">
      <select id="filter"><option value="">Semua wilayah</option></select>
      <select id="statusFilter"><option value="">Semua status</option></select>
    </div>
    <div class="seg">
      <button type="button" data-view="all"><svg class="ico"><use href="#i-globe"/></svg>Semua</button>
      <button type="button" data-view="sem"><svg class="ico"><use href="#i-mountain"/></svg>Semenanjung</button>
      <button type="button" data-view="sabah"><svg class="ico"><use href="#i-waves"/></svg>Sabah</button>
    </div>
    <div class="seg">
      <button type="button" data-mode="wilayah" class="on"><svg class="ico"><use href="#i-layers"/></svg>Warna wilayah</button>
      <button type="button" data-mode="status"><svg class="ico"><use href="#i-check"/></svg>Warna status</button>
    </div>
  </div>

  <div id="list"></div>

  <footer>⚠ = koordinat anggaran, perlu semak di lapangan. Kuantiti ikut Lampiran 1, Memo Pemindahan Bajet.</footer>
</aside>

<div id="map"></div>

<!-- Desktop: shown when the sidebar is closed -->
<button id="openSidebar" type="button" title="Buka senarai">
  <svg class="ico"><use href="#i-list"/></svg>Senarai
</button>

<!-- Mobile: bottom shortcut bar -->
<nav id="bottomNav">
  <button type="button" data-act="map"><svg class="ico"><use href="#i-map"/></svg>Map</button>
  <button type="button" data-act="search"><svg class="ico"><use href="#i-search"/></svg>Cari</button>
  <button type="button" data-act="sem"><svg class="ico"><use href="#i-mountain"/></svg>Semenanjung</button>
  <button type="button" data-act="all"><svg class="ico"><use href="#i-globe"/></svg>Semua</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="data.js?v=20261024"></script>
<script src="app.js?v=20261024"></script>
</body>
</html>
